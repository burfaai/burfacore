[tool.poetry]
name = "burfacore"
version = "0.1.0"
description = "Base Utilities for Burfa Packages"
packages = [{include = "burfacore"}]
authors = ["eneyi <ruth.ikwu@outlook.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12, <=3.13"
pydantic = "^2.10.4"
ruff = "^0.8.4"
gspread = "^6.1.4"
google-api-python-client = "^2.157.0"
oauth2client = "^4.1.3"
gsheets = "^0.6.1"
numpy = "<=2.2.0"
pandas = "^2.2.3"
pydantic-settings = "^2.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
